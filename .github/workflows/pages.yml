name: Deploy to GitHub Pages

# The site is the repository: no build step, nothing generated. The knowledge
# base is validated first so a malformed rule cannot reach the published app.
#
# The checks also run on pull requests. Running them only on a push to main
# would mean a reviewer sees no evidence at the moment they are deciding, and
# the first time anything is verified is after it has already been merged.
# Deployment stays on main: a pull request has nowhere to publish to.
#
# No base-branch filter on pull_request, deliberately. Filtering to main left a
# pull request stacked on another feature branch with no checks at all, which is
# the same blind spot one branch further out - and the reviewer of the stacked
# change needs the evidence just as much. The deploy job is guarded on the event
# instead, so widening this cannot publish from a pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the knowledge base
        run: node scripts/validate.mjs

      - name: Check the saved-library rules
        run: node scripts/test-library.mjs

      - name: Check the kundali calculation
        run: node scripts/test-astro.mjs

      - name: Check the chart-editing rules
        run: node scripts/test-edits.mjs

      - name: Check combustion
        run: node scripts/test-combustion.mjs

      - name: Check the dasha calendar
        run: node scripts/test-dasha.mjs

      - name: Check birth-time rectification
        run: node scripts/test-rectify.mjs

      - name: Check the markup against the scripts
        run: node scripts/test-dom.mjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
